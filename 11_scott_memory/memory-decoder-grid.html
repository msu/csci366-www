    while (el.firstChild) el.removeChild(el.firstChild)
    lines.forEach(function (ln, k) {
      var t = document.createElementNS(SVG_NS, 'tspan')
      t.setAttribute('x', x)
      t.setAttribute('dy', k === 0 ? '0' : dy)
      t.textContent = ln
      el.appendChild(t)
    })
  }

  function paintSvg(svg, nets, inputs) {
    svg.querySelectorAll('[data-net]').forEach(function (el) {
      var v = nets[el.getAttribute('data-net')]
      el.classList.toggle('is-1', v === 1)
      el.classList.toggle('is-z', v === null)
    })

    svg.querySelectorAll('[data-readout]').forEach(function (el) {
      var v = nets[el.getAttribute('data-readout')]
      var text = v === null ? (el.getAttribute('data-readout-z') || 'Z')
               : v === undefined ? ''
               : String(v)
      var wrap = Number(el.getAttribute('data-wrap'))
      if (wrap > 0) wrapInto(el, text, wrap)
      else if (el.textContent !== text) el.textContent = text
    })

    svg.querySelectorAll('[data-fill]').forEach(function (el) {
      var v = nets[el.getAttribute('data-fill')]
      if (v != null) el.style.fill = String(v)
    })

    svg.querySelectorAll('[data-input]').forEach(function (el) {
      el.setAttribute('aria-pressed', inputs[el.getAttribute('data-input')] === 1 ? 'true' : 'false')
    })

    svg.querySelectorAll('[data-on]').forEach(function (el) {
      var on = !!nets[el.getAttribute('data-on')]
      el.classList.toggle('is-on', on)
      el.classList.toggle('is-off', !on)
    })

    svg.querySelectorAll('[data-show]').forEach(function (el) {
      if (nets[el.getAttribute('data-show')]) el.removeAttribute('hidden')
      else el.setAttribute('hidden', '')
    })
  }


  var mountCount = 0
  var stageUid = 0

  function mount(root, opts) {
    opts = opts || {}
    root = root || document
    mountCount++

    var teardown = []
    var groups = {}
    var stages = []
    var keys = {}

    root.querySelectorAll('svg[data-logic]').forEach(function (svg) {
      var logic = svg.getAttribute('data-logic')
      var named = svg.getAttribute('data-solver')
      var spec = (named && SOLVERS[named]) || SOLVERS[logic] ||
                 (/^ripple-carry-\d+$/.test(logic) ? SOLVERS['ripple-carry'] : null)
      if (!spec) return

      var key = svg.getAttribute('data-state') || logic
      var g = groups[key]
      if (!g) {
        g = groups[key] = {
          key: key, logic: logic, spec: spec, solve: spec.solve,
          inputs: {}, initial: {}, state: spec.init(),
          nets: {}, svgs: [], sliders: [], subs: [],
          byLogic: {},
        }
      }
      if (!g.byLogic[logic]) g.byLogic[logic] = { spec: spec, state: spec.init(), nets: {} }
      svg.__diagramLogic = logic
      g.svgs.push(svg)

      svg.querySelectorAll('[data-input]').forEach(function (el) {
        var name = el.getAttribute('data-input')
        g.inputs[name] = el.getAttribute('data-init') === '1' ? 1 : 0
        g.initial[name] = g.inputs[name]
      })
    })

    Object.keys(groups).forEach(function (key) {
      var g = groups[key]

      g.repaint = function () {
        Object.keys(g.byLogic).forEach(function (name) {
          var e = g.byLogic[name]
          e.nets = e.spec.solve(g.inputs, e.state)
        })
        var nets = g.byLogic[g.logic].nets
        g.nets = nets
        g.sliders.forEach(function (sl) {
          var v = sl.bits.reduce(function (acc, nm) { return (acc << 1) | g.inputs[nm] }, 0)
          var pos = sl.flip ? sl.lo + sl.hi - v : v
          if (Number(sl.el.value) !== pos) sl.el.value = String(pos)
          sl.out.textContent = String(v)
        })
        g.svgs.forEach(function (svg) {
          paintSvg(svg, g.byLogic[svg.__diagramLogic].nets, g.inputs)
        })
        g.subs.slice().forEach(function (fn) { fn(nets, g.inputs, key) })
        if (opts.onpaint) opts.onpaint(nets, g.inputs, key)
        return nets
      }

      g.set = function (name, value) { g.inputs[name] = value ? 1 : 0; return g.repaint() }
      g.toggle = function (name) { g.inputs[name] = g.inputs[name] ? 0 : 1; return g.repaint() }
      g.reset = function () {
        Object.keys(g.initial).forEach(function (n) { g.inputs[n] = g.initial[n] })
        Object.keys(g.byLogic).forEach(function (name) {
          g.byLogic[name].state = g.byLogic[name].spec.init()
        })
        g.state = g.byLogic[g.logic].state
        return g.repaint()
      }
      g.onpaint = function (fn) {
        g.subs.push(fn)
        return function () {
          var k = g.subs.indexOf(fn)
          if (k !== -1) g.subs.splice(k, 1)
        }
      }

      g.svgs.forEach(function (svg) {
        var spec = svg.getAttribute('data-range-bits')
        if (!spec) return
        var bits = spec.split(',').map(function (b) { return b.trim() })
        var host = svg.closest('[data-diagram-slot]') || svg.parentNode
        if (!host || !host.parentNode) return
        var row = document.createElement('div')
        row.className = 'diagram-range'
        row.style.maxWidth = host.style ? (host.style.maxWidth || '') : ''
        var label = svg.getAttribute('data-range-label') || 'value'
        var lab = document.createElement('span')
        lab.textContent = label
        var el = document.createElement('input')
        el.type = 'range'
        el.min = svg.getAttribute('data-range-min') || '0'
        el.max = svg.getAttribute('data-range-max') || String((1 << bits.length) - 1)
        el.step = '1'
        el.setAttribute('aria-label', label)
        var out = document.createElement('span')
        out.className = 'diagram-range-out'
        row.append(lab, el, out)
        host.parentNode.insertBefore(row, host.nextSibling)
        var lo = Number(el.min), hi = Number(el.max)
        var flip = svg.getAttribute('data-range-reverse') === '1'
        var seed = Number(svg.getAttribute('data-range-init') || 0)
        for (var s = bits.length - 1; s >= 0; s--) {
          if (g.inputs[bits[s]] === undefined) {
            g.inputs[bits[s]] = seed & 1
            g.initial[bits[s]] = seed & 1
          }
          seed >>= 1
        }
        var onInput = function () {
          var v = Number(el.value)
          if (flip) v = lo + hi - v
          for (var k = bits.length - 1; k >= 0; k--) { g.inputs[bits[k]] = v & 1; v >>= 1 }
          g.repaint()
        }
        el.addEventListener('input', onInput)
        teardown.push(function () { el.removeEventListener('input', onInput); row.remove() })
        g.sliders.push({ el: el, out: out, bits: bits, flip: flip, lo: lo, hi: hi })
      })

      g.svgs.forEach(function (svg) {
        var spec = svg.getAttribute('data-pick-bits')
        if (!spec) return
        var bits = spec.split(',').map(function (b) { return b.trim() })
        var seed = Number(svg.getAttribute('data-pick-init') || 0)
        for (var s = bits.length - 1; s >= 0; s--) {
          if (g.inputs[bits[s]] === undefined) { g.inputs[bits[s]] = seed & 1; g.initial[bits[s]] = seed & 1 }
          seed >>= 1
        }
        svg.querySelectorAll('[data-pick]').forEach(function (el) {
          var v = Number(el.getAttribute('data-pick'))
          var go = function () {
            for (var k = bits.length - 1, x = v; k >= 0; k--) { g.inputs[bits[k]] = x & 1; x >>= 1 }
            g.repaint()
          }
          var onKey = function (e) {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); go() }
          }
          el.addEventListener('click', go)
          el.addEventListener('keydown', onKey)
          teardown.push(function () {
            el.removeEventListener('click', go)
            el.removeEventListener('keydown', onKey)
          })
        })
      })

      g.svgs.forEach(function (svg) {
        var spec = svg.getAttribute('data-step-bits')
        if (!spec) return
        var bits = spec.split(',').map(function (b) { return b.trim() })
        var max = Number(svg.getAttribute('data-step-max') || String((1 << bits.length) - 1))
        var ms = Number(svg.getAttribute('data-play-ms') || '1000')
        var playNet = svg.getAttribute('data-play-net')
        bits.forEach(function (nm) {
          if (g.inputs[nm] === undefined) { g.inputs[nm] = 0; g.initial[nm] = 0 }
        })
        if (playNet) { g.inputs[playNet] = 0; g.initial[playNet] = 0 }
        var timer = null
        var setPlaying = function (on) {
          if (on && !timer) timer = setInterval(function () { step(1) }, ms)
          if (!on && timer) { clearInterval(timer); timer = null }
          if (playNet) { g.inputs[playNet] = on ? 1 : 0; g.repaint() }
        }
        var step = function (by) {
          var v = bits.reduce(function (acc, nm) { return (acc << 1) | g.inputs[nm] }, 0)
          v = Math.max(0, Math.min(max, v + by))
          var atEnd = v === max
          for (var k = bits.length - 1; k >= 0; k--) { g.inputs[bits[k]] = v & 1; v >>= 1 }
          g.repaint()
          if (atEnd && timer) setPlaying(false)
        }
        teardown.push(function () { if (timer) clearInterval(timer); timer = null })
        var onPress = function (el, fn) {
          var onKey = function (e) {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); fn() }
          }
          el.addEventListener('click', fn)
          el.addEventListener('keydown', onKey)
          teardown.push(function () {
            el.removeEventListener('click', fn)
            el.removeEventListener('keydown', onKey)
          })
        }
        svg.querySelectorAll('[data-play]').forEach(function (el) {
          onPress(el, function () { setPlaying(!timer) })
        })
        svg.querySelectorAll('[data-step]').forEach(function (el) {
          var by = Number(el.getAttribute('data-step'))
          var go = function () { setPlaying(false); step(by) }
          var onKey = function (e) {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); go() }
          }
          el.addEventListener('click', go)
          el.addEventListener('keydown', onKey)
          teardown.push(function () {
            el.removeEventListener('click', go)
            el.removeEventListener('keydown', onKey)
          })
        })
      })

      g.svgs.forEach(function (svg) {
        svg.querySelectorAll('[data-input]').forEach(function (el) {
          var name = el.getAttribute('data-input')
          var flip = function () { g.toggle(name) }
          var onKey = function (e) {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); flip() }
          }
          el.addEventListener('click', flip)
          el.addEventListener('keydown', onKey)
          teardown.push(function () {
            el.removeEventListener('click', flip)
            el.removeEventListener('keydown', onKey)
          })
        })
        svg.classList.add('is-ready')
        teardown.push(function () { svg.classList.remove('is-ready') })
      })
    })

    if (opts.stages !== false) {
      root.querySelectorAll('[data-stages]').forEach(function (box, boxIndex) {
        var panes = Array.prototype.filter.call(box.children, function (c) {
          return c.nodeType === 1 && c.hasAttribute('data-stage')
        })
        if (!panes.length) panes = Array.prototype.slice.call(box.querySelectorAll('[data-stage]'))
        if (panes.length < 2) return

        var bar = document.createElement('div')
        bar.className = 'diagram-tabs'
        bar.setAttribute('role', 'tablist')
        var uid = ++stageUid
        var made = []
        var tabs = panes.map(function (pane, i) {
          if (!pane.id) { pane.id = 'diagram-stage-' + uid + '-' + i; made.push(pane) }
          var b = document.createElement('button')
          b.type = 'button'
          b.className = 'diagram-tab'
          b.setAttribute('role', 'tab')
          b.setAttribute('aria-controls', pane.id)
          b.textContent = pane.getAttribute('data-stage-label') || String(i + 1)
          bar.appendChild(b)
          return b
        })
        box.insertBefore(bar, box.firstChild)

        var owner = boxIndex === 0 && opts.hash !== false &&
                    typeof location !== 'undefined'

        var ctlStage = { el: box, panes: panes, tabs: tabs, index: 0 }

        ctlStage.show = function (i, viaUser) {
          if (i < 0 || i >= panes.length) return
          ctlStage.index = i
          panes.forEach(function (p, k) {
            if (k === i) p.removeAttribute('hidden')
            else p.setAttribute('hidden', '')
          })
          tabs.forEach(function (t, k) {
            t.setAttribute('aria-selected', k === i ? 'true' : 'false')
            t.tabIndex = k === i ? 0 : -1
            t.classList.toggle('is-active', k === i)
          })
          if (owner && viaUser) {
            if (history.replaceState) history.replaceState(null, '', '#stage-' + (i + 1))
            else location.hash = 'stage-' + (i + 1)
          }
        }

        tabs.forEach(function (t, i) {
          var onClick = function () { ctlStage.show(i, true) }
          t.addEventListener('click', onClick)
          teardown.push(function () { t.removeEventListener('click', onClick) })
        })

        var onBarKey = function (e) {
          var i = tabs.indexOf(document.activeElement)
          if (i === -1) return
          var next = e.key === 'ArrowLeft' ? i - 1
                   : e.key === 'ArrowRight' ? i + 1
                   : e.key === 'Home' ? 0
                   : e.key === 'End' ? tabs.length - 1
                   : -1
          if (next === -1) return
          e.preventDefault()
          next = (next + tabs.length) % tabs.length
          ctlStage.show(next, true)
          tabs[next].focus()
        }
        bar.addEventListener('keydown', onBarKey)

        teardown.push(function () {
          bar.removeEventListener('keydown', onBarKey)
          bar.remove()
          panes.forEach(function (p) { p.removeAttribute('hidden') })
          made.forEach(function (p) { p.removeAttribute('id') })
        })

        var start = 0
        if (owner) {
          var m = /^#stage-(\d+)$/.exec(location.hash)
          if (m && Number(m[1]) >= 1 && Number(m[1]) <= panes.length) start = Number(m[1]) - 1
        }
        ctlStage.show(start, false)
        stages.push(ctlStage)
      })
    }

    function claim(k, binding, what) {
      k = normKey(k)
      if (!k) return
      if (RESERVED.indexOf(k) !== -1) {
        console.warn('[diagram] key "' + k + '" is reserved by the deck or the browser; ' +
                     what + ' was not bound')
        return
      }
      var held = keys[k]
      if (held) {
        var staged = binding.stage && held.every(function (b) { return b.stage && b.stage !== binding.stage })
        if (!staged) {
          console.warn('[diagram] key "' + k + '" claimed by both ' + held[0].what + ' and ' +
                       what + '; the first in document order wins')
          return
        }
        held.push(binding)
      } else {
        keys[k] = [binding]
      }
      binding.key = k
      binding.what = what
    }

    stages.forEach(function (st) {
      if (st.el.getAttribute('data-stage-keys') === 'off') return
      st.panes.forEach(function (pane, i) {
        if (i >= 9) return
        claim(String(i + 1), { kind: 'stage', stage: null, stages: st, index: i },
              'stage ' + (i + 1))
      })
    })

    Object.keys(groups).forEach(function (key) {
      var g = groups[key]
      g.svgs.forEach(function (svg) {
        var auto = svg.getAttribute('data-keys') === 'auto'
        svg.querySelectorAll('[data-input]').forEach(function (el) {
          var name = el.getAttribute('data-input')
          var want = el.getAttribute('data-key') || (auto ? name.charAt(0) : '')
          if (!want) return
          var b = {
            kind: 'input', group: g, name: name, el: el,
            stage: el.closest ? el.closest('[data-stage]') : null,
          }
          claim(want, b, 'input "' + name + '"')
          if (b.key && !el.hasAttribute('aria-keyshortcuts')) {
            el.setAttribute('aria-keyshortcuts', b.key.toUpperCase())
            teardown.push(function () { el.removeAttribute('aria-keyshortcuts') })
          }
        })
      })
    })

    function pick(list) {
      for (var i = 0; i < list.length; i++) {
        if (!list[i].stage || !list[i].stage.hasAttribute('hidden')) return list[i]
      }
      return null
    }

    function blocked(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return true
      var ae = document.activeElement
      return !!(ae && ae.matches && ae.matches('input, textarea, select, [contenteditable]'))
    }

    function lookup(e) {
      if (blocked(e)) return null
      if (opts.keys === 'focus' && !root.contains(document.activeElement)) return null
      var list = keys[normKey(e.key)]
      return list ? pick(list) : null
    }

    var onKeyDown = function (e) {
      if (e.repeat) return
      var b = lookup(e)
      if (!b) return
      e.preventDefault()
      e.stopPropagation()
      if (b.kind === 'stage') { b.stages.show(b.index, true); return }
      b.group.toggle(b.name)
      if (b.el.focus) b.el.focus({ preventScroll: true })
    }

    var onKeyUp = function (e) {
      if (lookup(e)) e.stopPropagation()
    }

    var keyTarget = opts.keys === 'focus' ? root : document
    if (opts.keys !== false && Object.keys(keys).length) {
      keyTarget.addEventListener('keydown', onKeyDown)
      keyTarget.addEventListener('keyup', onKeyUp)
      teardown.push(function () {
        keyTarget.removeEventListener('keydown', onKeyDown)
        keyTarget.removeEventListener('keyup', onKeyUp)
      })
    }

    var onFocusedKey = function (e) {
      if (e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return
      var ae = document.activeElement
      var toggle = ae && ae.closest ? ae.closest('[data-input]') : null
      if (toggle && root.contains(toggle)) e.stopPropagation()
    }
    root.addEventListener('keydown', onFocusedKey)
    root.addEventListener('keyup', onFocusedKey)
    teardown.push(function () {
      root.removeEventListener('keydown', onFocusedKey)
      root.removeEventListener('keyup', onFocusedKey)
    })

    if (typeof opts.lock === 'function') {
      var unlock = null
      var release = function () { if (unlock) { unlock(); unlock = null } }
      var onIn = function () { if (!unlock) unlock = opts.lock() }
      var onOut = function (e) {
        if (e.relatedTarget && root.contains(e.relatedTarget)) return
        release()
      }
      root.addEventListener('focusin', onIn)
      root.addEventListener('focusout', onOut)
      teardown.push(function () {
        root.removeEventListener('focusin', onIn)
        root.removeEventListener('focusout', onOut)
        release()
      })
    }

    Object.keys(groups).forEach(function (k) { groups[k].repaint() })

    var ctl = {
      groups: groups,
      stages: stages,
      keys: keys,
      repaintAll: function () { Object.keys(groups).forEach(function (k) { groups[k].repaint() }) },
      destroy: function () {
        teardown.splice(0).reverse().forEach(function (off) { off() })
        stages.length = 0
        Object.keys(keys).forEach(function (k) { delete keys[k] })
      },
    }
    return ctl
  }

  function init(onpaint) {
    return mount(document, { onpaint: onpaint }).groups
  }

  var api = { define: define, mount: mount, init: init, solvers: SOLVERS }

  if (typeof document !== 'undefined') {
    var auto = function () {
      if (mountCount) return
      if (document.documentElement.hasAttribute('data-diagram-manual')) return
      if (!document.querySelector('svg[data-logic]')) return
      api.auto = mount(document, {})
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', auto)
    else setTimeout(auto, 0)
  }

  return api
})()

</script>
</body>
</html>
